[package]
name = "cobotrix"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

default-run = "cobotnil"

[[bin]]
name = "cobotnil"
path = "src/cobotnil.rs"

[[bin]]
name = "cobotlet"
path = "src/cobotlet.rs"

[[bin]]
name = "cobotsrv"
path = "src/cobotsrv.rs"

[workspace]
members = [
    ".",
    "cobotlet",
    "cobotsrv",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
authors = ["BinBat Ltd <hey@binbat.com>"]
repository = "https://github.com/binbat/live777"

[workspace.dependencies]
net4mqtt = { git = "https://github.com/binbat/live777", rev = "996d034" }
auth = { git = "https://github.com/binbat/live777", rev = "996d034" }
signal = { git = "https://github.com/binbat/live777", rev = "996d034" }
http-log = { git = "https://github.com/binbat/live777", rev = "996d034" }

axum = "0.8"
tower-http = "0.6"
rust-embed = "8.7"
mime_guess = "2.0"

anyhow = "1.0"
clap = "4.5"
http = "1.3"
http-body = "1.0"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
serde = "1.0"
serde_json = "1.0"
tokio = "1.47"
tracing = "0.1"
url = "2.5"

[dependencies]
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["fs"] }
net4mqtt = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }

toml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

cobotlet = { path = "cobotlet" }
cobotsrv = { path = "cobotsrv" }
signal = { workspace = true }

[features]
default = ["net4mqtt"]
webui = ["cobotlet/webui", "cobotsrv/webui"]
net4mqtt = ["cobotlet/net4mqtt", "cobotsrv/net4mqtt"]

