[package]
name = "yufu-root"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

default-run = "yufu"
autobins = false

[[bin]]
name = "yufu"
path = "src/yufu.rs"

[workspace]
members = [".", "yufu", "libs/auth"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
authors = ["BinBat Ltd <hey@binbat.com>"]
repository = "https://github.com/binbat/live777"

[workspace.dependencies]
auth = {path = "libs/auth" }
http-log = { git = "https://github.com/binbat/live777", rev = "a1ba82c" }
futures = "0.3"
axum = "0.8"
tower = "0.5"
tower-http = "0.6"
rust-embed = "8.7"
mime_guess = "2.0"

anyhow = "1.0"
clap = "4.5"
http = "1.3"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
serde = "1.0"
serde_json = "1.0"
tokio = "1.47"
tracing = "0.1"
url = "2.5"
chrono = "0.4"

utoipa = { version = "6.0", features = ["axum_extras"] }
utoipa-swagger-ui = {version = "10.0", features = ["axum", "vendored"]}
uuid = {version = "1.18.1", features = ["v4"]}


[dependencies]
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }
tracing = { workspace = true }
anyhow = { workspace = true }

toml = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

yufu = { path = "yufu" }

[dev-dependencies]
async-trait = "0.1.89"
bcrypt = "0.16"
serde = { workspace = true }
uuid =  { workspace = true }
auth = { workspace = true }
testcontainers = { version = "0.28.0", features = ["blocking"] }
portpicker = "0.1.1"
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
axum = { workspace = true }
rsa = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
jsonwebtoken = "9.3"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
chrono = { workspace = true }
sea-orm = { version = "2.0.0-rc.2", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[features]
default = []
webui = ["yufu/webui"]
openapi = ["yufu/openapi"]

[profile.dev]
# 默认是 2（完整调试信息）。改为 1（仅保留行号），可以减少 50%~80% 的体积
debug = 1 

# 让编译器单独存放调试信息，而不是全部塞进链接器，减轻 ld 的并发压力
split-debuginfo = "unpacked" 

[profile.test]
# 同理，应用到测试 profile 中
debug = 1
split-debuginfo = "unpacked"
