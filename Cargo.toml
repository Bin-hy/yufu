[package]
name = "cobotrix-root"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

default-run = "cobotnil"

[[bin]]
name = "cobotnil"
path = "src/cobotnil.rs"

[[bin]]
name = "cobotlet"
path = "src/cobotlet.rs"

[[bin]]
name = "cobotsrv"
path = "src/cobotsrv.rs"

[[bin]]
name = "cobotrix"
path = "src/cobotrix.rs"

[workspace]
members = [".", "cobotlet", "cobotsrv", "cobotrix", "libs/auth"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
authors = ["BinBat Ltd <hey@binbat.com>"]
repository = "https://github.com/binbat/live777"

[workspace.dependencies]
auth = {path = "libs/auth" }
net4mqtt = { git = "https://github.com/binbat/live777", rev = "a1ba82c" }
signal = { git = "https://github.com/binbat/live777", rev = "a1ba82c" }
http-log = { git = "https://github.com/binbat/live777", rev = "a1ba82c" }

axum = "0.8"
tower = "0.5"
tower-http = "0.6"
rust-embed = "8.7"
mime_guess = "2.0"

anyhow = "1.0"
clap = "4.5"
http = "1.3"
http-body = "1.0"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
serde = "1.0"
serde_json = "1.0"
tokio = "1.47"
tracing = "0.1"
url = "2.5"
chrono = "0.4"

utoipa-axum = "0.2"
utoipa = { version = "5.4", features = ["axum_extras"] }
utoipa-swagger-ui = {version = "9.0", features = ["axum"]}
uuid = {version = "1.18.1", features = ["v4"]}

redb = "4"
rumqttc = "0.24"
dashmap = "6"

[dependencies]
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["fs"] }
net4mqtt = { workspace = true, features = ["test-utils"] }
tracing = { workspace = true }
serde = { workspace = true }
anyhow ={ workspace = true }
uuid =  { workspace = true }
auth = { workspace = true }

toml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
testcontainers = {version = "0.25.0", features = ["blocking"]}
testcontainers-modules = { version = "0.13.0", features = ["postgres"] }

cobotlet = { path = "cobotlet" }
cobotsrv = { path = "cobotsrv" }
cobotrix = { path = "cobotrix" }
signal = { workspace = true }

[dev-dependencies]
portpicker = "0.1.1"
futures = { version = "0.3", default-features = false }
reqwest = { workspace = true, features = ["socks", "json"] }

[features]
default = ["net4mqtt"]
webui = ["cobotlet/webui", "cobotsrv/webui", "cobotrix/webui"]
net4mqtt = ["cobotlet/net4mqtt", "cobotsrv/net4mqtt", "cobotrix/net4mqtt"]
openapi= ["cobotsrv/openapi"]

