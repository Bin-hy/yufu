services:
    postgres:
        image: postgres:18-alpine
        container_name: postgres18
        restart: always
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: test
            POSTGRES_PORT: 5432
        volumes:
            - cobotrix_postgis_test:/var/lib/postgresql

volumes:
    cobotrix_postgis_test:
