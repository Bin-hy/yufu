
services:
    postgistest:
        image: postgres:17-alpine
        container_name: postgis_test
        restart: always
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: test
            POSTGRES_PORT: 5432
        volumes:
            - cobotrix_postgis_test:/var/lib/postgresql/data

volumes:
    cobotrix_postgis_test:
