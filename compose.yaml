services:
    postgres_yufu:
        image: postgres:18-alpine
        container_name: postgres_yufu
        restart: always
        ports:
            - "${POSTGRES_YUFU_PORT:-5433}:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_YUFU_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_YUFU_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_YUFU_DB:-yufu}
        volumes:
            - yufu_pg:/var/lib/postgresql

volumes:
    yufu_pg:
