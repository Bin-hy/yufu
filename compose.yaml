services:
    postgres_cobotusr:
        image: postgres:18-alpine
        container_name: postgres_cobotusr
        restart: always
        ports:
            - "${POSTGRES_USR_PORT:-5433}:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USR_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_USR_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_USR_DB:-cobotusr}
        volumes:
            - cobotrix_pg_usr:/var/lib/postgresql

volumes:
    cobotrix_pg_usr:
