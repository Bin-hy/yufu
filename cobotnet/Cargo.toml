[package]
name = "cobotnet"
description = "CoBotrix P2P VPN network service based on EasyTier/WireGuard + ICE"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
authors = ["BinBat Ltd <hey@binbat.com>"]
repository = "https://github.com/binbat/live777"

[lib]
crate-type = ["lib"]

[dependencies]
easytier = { git = "https://github.com/EasyTier/EasyTier", tag = "v2.6.4", optional = true, default-features = false, features = [
    "wireguard",
    "tun",
    "socks5",
    "websocket",
    "magic-dns",
] }
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }
serde = "1.0"
tracing = "0.1"
anyhow = "1.0"
url = "2.5"
uuid = "1.18.1"
cidr = "0.3"

[features]
default = []
easytier = ["dep:easytier"]
