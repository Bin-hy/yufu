[package]
name = "cobotnet"
description = "CoBotrix P2P VPN network service based on EasyTier/WireGuard + ICE"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
easytier = { git = "https://github.com/EasyTier/EasyTier", rev = "v2.6.4", default-features = false, features = [
    "wireguard",
    "tun",
    "socks5",
    "websocket",
    "magic-dns",
] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
serde = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
cidr = "0.3"
