[http]
# Http Server Listen Address
# listen = "[::]:4000"
# Cross-Origin Resource Sharing (CORS)
# reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS
cors = false
# api_prefix = "/api/v1"

# Headers["Authorization"] = "Bearer {token}"
 [auth]
# JSON WEB TOKEN secret
# secret = "<jwt_secret>"
# static JWT token, superadmin, debuggger can use this token
# tokens = ["live777"]
# expiration_seconds, default 5min.
# exp_seconds = 300
# refresh_expiration_seconds, default 30d.
# refresh_exp_seconds = 2592000 # 30*24*3600
# CORS origins 列表
origins = [
    "http://localhost:5173",
    "https://example.com"
]

# add a superadmin
[auth.super_admin]
# username = "sadmin"
# password = "sadmin"
# Admin Dashboard Accounts
# [[auth.accounts]]
# username = "live777"
# password = "live777"

[log]
# Env: `LOG_LEVEL`
# Default: info
# Values: off, error, warn, info, debug, trace
# level = "warn"

[database]
url = "postgres://postgres:postgres@localhost:5432/cobotrix"
# max connections (Default: 10, unit: second)
max_connections = 10
# timeout  (Default: 30 ,unit: second)
connect_timeout = 30

# [net4mqtt]
# Global unique alias
# alias = "liveman-0"
# `client_id={alias}` use alias as MQTT `client_id`
# mqtt_url = "mqtt://localhost:1883/net4mqtt?client_id={alias}"
# listen = "127.0.0.1:1077"
# domain = "net4mqtt.local"

# [[nodes]]
# Globally unique id
# alias = "static-0"
# Auth token
# token = "live777"
# Live777 Address
# url = "http://127.0.0.1:7777"

# [[nodes]]
# alias = "static-1"
# token = "live777"
# url = "http://127.0.0.1:7778"

