services:
    emqx:
        image: emqx/emqx:latest
        ports:
            - 1883:1883
            - 18083:18083

    postgres:
        image: postgres:18-alpine
        container_name: postgres18
        restart: always
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: cobotrix
            POSTGRES_PORT: 5432
        volumes:
            - cobotrix_postgres:/var/lib/postgresql

volumes:
    cobotrix_postgres:
