[log]
# Env: `LOG_LEVEL`
# Default: info
# Values: off, error, warn, info, debug, trace
# level = "debug"

[database]
url = "postgres://postgres:postgres@localhost:5432/cobotrix_mgmt"
max_connections = 10
connect_timeout = 30

# MQTT 连接（设备发现 + 任务调度）
# [mqtt]
# url = "mqtt://localhost:1883"
# client_id = "cobotrix"
# topic_prefix = "cobotrix"
# keep_alive_secs = 30

[task]
# 同步任务默认超时 (ms)
wait_timeout_ms = 5000
# 异步任务结果缓存时间 (s)
result_cache_ttl_secs = 300

# net4mqtt SOCKS5 代理隧道（cobotrix → cobotlet 反向代理）
# [net4mqtt]
# alias = "cobotrix"
# mqtt_url = "mqtt://localhost:1883/net4mqtt?client_id={alias}"
# listen = "0.0.0.0:1077"
# domain = "net4mqtt.local"

# 静态 cobotlet 节点（net4mqtt 自动发现以外的节点）
