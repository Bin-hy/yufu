[http]
listen = "127.0.0.1:3001"

[storage]
path = "data/cobotlet-1.redb"

# Default enabled `--features=net4mqtt`
[net4mqtt]
# Global unique alias
alias = "cobotlet-1"
# `client_id={alias}` use alias as MQTT `client_id`
mqtt_url = "mqtt://localhost:1883/net4mqtt?client_id={alias}"

# ── Control Preset: 按钮矩阵 ──
[control_preset]
template = "button_matrix"

[control_preset.mapping.arm_up]
capability = "arm_control"
mode = "press_release"
params = { axis = "z", value = 1.0 }
release_params = { axis = "z", value = 0.0 }

[control_preset.mapping.arm_down]
capability = "arm_control"
mode = "press_release"
params = { axis = "z", value = -1.0 }
release_params = { axis = "z", value = 0.0 }

[control_preset.mapping.grip_open]
capability = "gripper"
mode = "fire_once"
params = { action = "open" }

[control_preset.mapping.grip_close]
capability = "gripper"
mode = "fire_once"
params = { action = "close" }

[control_preset.mapping.home]
capability = "arm_control"
mode = "fire_once"
params = { action = "home" }
