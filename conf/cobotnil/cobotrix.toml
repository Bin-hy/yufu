[http]
listen = "127.0.0.1:4001"

[database]
url = "postgres://postgres:postgres@localhost:5432/cobotrix_mgmt"
max_connections = 10
connect_timeout = 30

# cobotrix pulls cobotsrv's public key from JWKS at startup. Default jwks_url
# points at 127.0.0.1:4000 (matches conf/cobotnil/cobotsrv.toml's listen) so the
# dev cluster works with no explicit auth config.
[auth]
client_id = "cobotrix"
client_secret = "dev-cobotrix-secret-change-me"

# Permissions cobotrix requires — automatically synced to cobotsrv at startup.
# Admin assigns these to roles in cobotsrv's /permissions/assign page.
[[permissions]]
name = "device:read"
action = "read"
resource_type = "device"

[[permissions]]
name = "task:execute"
action = "submit"
resource_type = "task"

[[permissions]]
name = "task:read"
action = "read"
resource_type = "task"

[[permissions]]
name = "remote:proxy"
action = "proxy"
resource_type = "remote"

[mqtt]
url = "mqtt://127.0.0.1:1883"
client_id = "cobotrix"
topic_prefix = "cobotrix"
keep_alive_secs = 30

[task]
wait_timeout_ms = 5000
result_cache_ttl_secs = 300

[net4mqtt]
alias = "cobotrix"
mqtt_url = "mqtt://localhost:1883/net4mqtt?client_id={alias}"
listen = "127.0.0.1:1078"
domain = "net4mqtt.local"
