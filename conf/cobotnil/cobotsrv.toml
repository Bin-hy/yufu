[http]
listen = "127.0.0.1:4001"

[log]
level = "info"

[database]
url = "postgres://postgres:postgres@localhost:5432/cobotsrv"
max_connections = 10
connect_timeout = 30

# cobotsrv pulls cobotusr's public key from JWKS at startup. Default jwks_url
# points at 127.0.0.1:4000 (matches conf/cobotnil/cobotusr.toml's listen)
# so the dev cluster works without explicit jwks_url config.
[auth]
client_id = "cobotsrv"
# client_secret 仅旧版回退用;新版权限同步走下方 machine client。
sync_client_id = "cobotsrv-sync"
sync_client_secret = "dev-cobotsrv-sync-secret-change-me"

# Permissions cobotsrv requires — automatically synced to cobotusr at startup.
# Admin assigns these to roles in cobotusr's /permissions/assign page.
[[permissions]]
name = "device:read"
action = "read"
resource_type = "device"

[[permissions]]
name = "task:execute"
action = "submit"
resource_type = "task"

[[permissions]]
name = "task:read"
action = "read"
resource_type = "task"

[[permissions]]
name = "remote:proxy"
action = "proxy"
resource_type = "remote"

[[permissions]]
name = "mcp:access"
action = "access"
resource_type = "mcp"

[[permissions]]
name = "mcp:admin"
action = "admin"
resource_type = "mcp"

[mcp]
call_timeout_ms = 30000

[mqtt]
url = "mqtt://127.0.0.1:1883"
client_id = "cobotsrv"
topic_prefix = "cobotrix"
keep_alive_secs = 30

[task]
wait_timeout_ms = 5000
result_cache_ttl_secs = 300

[net4mqtt]
alias = "cobotsrv"
mqtt_url = "mqtt://localhost:1883/net4mqtt?client_id={alias}"
listen = "127.0.0.1:1078"
domain = "net4mqtt.local"

[easytier]
network_name = "cobotrix-prod"
network_secret = "your-secret"
ipv4 = "10.100.0.1"
listeners = ["tcp://0.0.0.0:11010"]
peers = ["tcp://bootstrap.example.com:11010"]
