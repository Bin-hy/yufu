[http]
listen = "127.0.0.1:4000"

[log]
level = "info"

[auth]
# JWT signing secret — change in production!
# secret = "<jwt_secret>"
exp_seconds = 3600
refresh_exp_seconds = 2592000
origins = ["*"]

[auth.super_admin]
username = "admin"
password = "admin"

[database]
url = "postgres://postgres:postgres@localhost:5432/cobotusr"
max_connections = 10
connect_timeout = 30

[oidc]
# Auto-register cobotsrv as an OIDC client on first start so the dev frontend
# can run Authorization Code + PKCE without manual registration.
# Stable secret is OK here because this file is only used by the dev cluster.
[[oidc.bootstrap_clients]]
client_id = "cobotsrv"
name = "CoBotrix Device Management Server (dev)"
redirect_uris = ["http://localhost:5174/oauth/callback", "http://localhost:4001/oauth/callback"]
allowed_scopes = ["openid", "profile", "email"]
grant_types = ["authorization_code", "refresh_token", "client_credentials"]
client_secret = "dev-cobotsrv-secret-change-me"

[[oidc.bootstrap_clients]]
client_id = "cobotimx"
name = "CoBotrix IM (dev)"
redirect_uris = ["http://localhost:5174/oauth/callback", "http://localhost:5174/login"]
allowed_scopes = ["openid", "profile", "email"]
grant_types = ["authorization_code", "refresh_token"]
public_client = true
