# cobotusr - User & Auth Service (IdP + PDP)
# cobotrix 统一启动器配置目录（conf/cobotrix/），由 `cobotrix -c conf/cobotrix` 加载。
# 生产环境请修改 secret、password、database url。

[http]
listen = "127.0.0.1:4000"

[log]
level = "info"

[auth]
exp_seconds = 3600
refresh_exp_seconds = 2592000
origins = ["*"]

[auth.super_admin]
username = "admin"
password = "admin"

[database]
url = "postgres://postgres:postgres@localhost:5432/cobotusr"
max_connections = 10
connect_timeout = 30

[oidc]
[[oidc.bootstrap_clients]]
client_id = "cobotsrv"
name = "CoBotrix Device Management Server"
redirect_uris = ["http://localhost:5174/oauth/callback"]
allowed_scopes = ["openid", "profile", "email"]
grant_types = ["authorization_code", "refresh_token", "client_credentials"]
# 与 conf/cobotrix/cobotsrv.toml [auth].client_secret 保持一致
client_secret = "dev-cobotsrv-secret-change-me"

# Cobotrix IM is a public SPA client. PKCE (S256) proves possession during
# authorization-code exchange, so no client secret is exposed in the browser.
[[oidc.bootstrap_clients]]
client_id = "cobotimx"
name = "CoBotrix IM"
redirect_uris = ["http://localhost:5174/oauth/callback", "http://localhost:5174/login"]
allowed_scopes = ["openid", "profile", "email"]
grant_types = ["authorization_code", "refresh_token"]
public_client = true
