# 复制为 conf/cobotsrv.toml 或 conf/cobotsrv.local.toml 后按需修改。
# 本文件是仓库中的可提交模板，不应包含任何真实密钥。

[http]
# Http Server Listen Address (生产环境建议仅监听 localhost)
listen = "[::]:4001"

# JWT 验签配置。cobotsrv 作为 cobotusr 的 OIDC client，启动时从 cobotusr 的 JWKS
# 端点拉取公钥用于验签 Bearer token。无需共享密钥。
[auth]
# client_id = "cobotsrv"           # OIDC client_id，对应 cobotusr 的 bootstrap_clients
# client_secret = ""               # OIDC client_secret，用于 refresh_token + permission sync
# jwks_url = "http://127.0.0.1:4000/.well-known/jwks.json"  # 或环境变量 COBOTSRV_JWKS_URL
# jwks_refresh_secs = 300
# expected_audience = "cobotsrv"  # 只接受 aud=cobotsrv 的 token

# 启动时自动同步到 cobotusr 的权限列表。管理员在 cobotusr 前端分配给角色即可。
# [[permissions]]
# name = "device:read"
# action = "read"
# resource_type = "device"
# [[permissions]]
# name = "task:execute"
# action = "submit"
# resource_type = "task"
# [[permissions]]
# name = "task:read"
# action = "read"
# resource_type = "task"
# [[permissions]]
# name = "remote:proxy"
# action = "proxy"
# resource_type = "remote"

[log]
# Env: `LOG_LEVEL`
# Default: info
# Values: off, error, warn, info, debug, trace
# level = "debug"

[database]
url = "postgres://postgres:postgres@localhost:5432/cobotsrv_mgmt"
max_connections = 10
connect_timeout = 30

# MQTT 连接（设备发现 + 任务调度）
# [mqtt]
# url = "mqtt://localhost:1883"
# client_id = "cobotsrv"
# topic_prefix = "cobotsrv"
# keep_alive_secs = 30

[task]
# 同步任务默认超时 (ms)
wait_timeout_ms = 5000
# 异步任务结果缓存时间 (s)
result_cache_ttl_secs = 300

# net4mqtt SOCKS5 代理隧道（cobotsrv → cobotlet 反向代理）
# [net4mqtt]
# alias = "cobotsrv"
# mqtt_url = "mqtt://localhost:1883/net4mqtt?client_id={alias}"
# listen = "0.0.0.0:1077"
# domain = "net4mqtt.local"

# 静态 cobotlet 节点（net4mqtt 自动发现以外的节点）
# [[nodes]]
# alias = "static-device-0"
# token = ""
# url = "http://127.0.0.1:3000"

# MCP Server 配置（Model Context Protocol — AI Agent 调用设备能力）
[mcp]
# tools/call 最大等待时间 (ms)，默认 30s
call_timeout_ms = 30000

# MCP 权限（启动时同步至 cobotusr，管理员分配给 AI Agent 角色）
# 需要 mcp:access 权限才能连接 MCP Server (POST/GET /mcp)
[[permissions]]
name = "mcp:access"
action = "access"
resource_type = "mcp"
resource_pattern = "*"
# Globally unique id
# alias = "static-0"
# Auth token
# token = "live777"
# Live777 Address
# url = "http://127.0.0.1:7777"

# [[nodes]]
# alias = "static-1"
# token = "live777"
# url = "http://127.0.0.1:7778"

# [[nodes]]
# Globally unique id
# alias = "static-0"
# Auth token
# token = "live777"
# Live777 Address
# url = "http://liveion-0.net4mqtt.local:7777"

[easytier]
network_name = "cobotrix-prod"
network_secret = "your-secret"
ipv4 = "10.100.0.1"
listeners = ["tcp://0.0.0.0:11010"]
peers = ["tcp://bootstrap.example.com:11010"]
