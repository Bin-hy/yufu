[package]
name = "cobotusr"
description = "CoBotrix User & Auth Service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
mime_guess = { workspace = true }
mime = { workspace = true }
infer = { workspace = true }
futures = { workspace = true }
net4mqtt = { workspace = true, optional = true }
auth = { workspace = true }
http-log = { workspace = true }
signal = { workspace = true }

axum = { workspace = true, features = ["multipart", "tracing", "ws"] }
rust-embed = { workspace = true, features = ["axum-ex"], optional = true }
anyhow = { workspace = true, features = ["backtrace"] }
clap = { workspace = true, features = ["derive"] }
http = { workspace = true }
http-body = { workspace = true }
reqwest = { workspace = true, features = ["socks"] }
serde = { workspace = true, features = ["serde_derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal","full"] }
tower = {workspace = true}
tower-http = { workspace = true, features = ["trace", "cors"] }
tracing = { workspace = true }
chrono = { workspace = true, features = ["serde"]}
uuid= {workspace = true}
rumqttc = { workspace = true }
url = { workspace = true }
dashmap = { workspace = true }

utoipa = { workspace= true, optional = true }
utoipa-axum = {workspace = true, optional = true}
utoipa-swagger-ui = { workspace= true, optional = true }

http-body-util = "0.1.3"
log = "0.4.28"
bcrypt = "0.16"

rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
urlencoding = "2.1"
rsa = { version = "0.9", features = ["pem"] }

# Database dependencies
sea-orm = { version = "2.0.0-rc.2",features = [
        "sqlx-postgres",
        "runtime-tokio-rustls",
        "macros",
        "with-chrono",
        "with-uuid",
    ]}

sea-orm-migration = "2.0.0-rc.2"
async-trait = "0.1.89"
axum-extra = { version = "0.10.3", features = ["typed-header"] }


[features]
webui = ["dep:rust-embed"]
openapi= ["dep:utoipa","dep:utoipa-swagger-ui", "dep:utoipa-axum"]
net4mqtt = ["dep:net4mqtt"]
