[package]
name = "cobotlet"
description = "CoBotrix device agent service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
net4mqtt = { workspace = true, optional = true }
cobotnet = { workspace = true, optional = true }
auth = { workspace = true }

axum = { workspace = true, features = ["multipart", "tracing"] }
tower-http = { workspace = true, features = ["trace", "cors"] }
rust-embed = { workspace = true, features = ["axum-ex"], optional = true }
mime_guess = { workspace = true, optional = true }

anyhow = { workspace = true, features = ["backtrace"] }
clap = { workspace = true, features = ["derive"] }
http = { workspace = true }
serde = { workspace = true, features = ["serde_derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dashmap = { workspace = true }
redb = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rumqttc = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = { workspace = true }

[features]
webui = ["dep:rust-embed", "dep:mime_guess"]
net4mqtt = ["dep:net4mqtt"]
easytier = ["dep:cobotnet"]