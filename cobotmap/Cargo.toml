[package]
name = "cobotmap"
description = "CoBotrix map proxy service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "cobotmap"
crate-type = ["lib"]

[dependencies]
axum = { workspace = true }
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1", "ring"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "client-proxy", "http1", "tokio"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tracing = { workspace = true }
url = { workspace = true }


