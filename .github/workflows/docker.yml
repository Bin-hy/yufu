name: Container image

# Builds the identity service image and publishes it to ghcr.io.
#
# Two entry points:
#   • release.yml calls this right after the GitHub release is published, so a
#     single tag push produces both the release assets and the matching image.
#   • workflow_dispatch republishes an image without cutting a new release.
#
# After the first publish the package is private by default. Anonymous
# `docker pull` only works once it is switched to public in
# Repository → Packages → yufu → Package settings.

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without the v prefix, for example 1.2.3'
        required: true
        type: string
      prerelease:
        description: 'true keeps only the exact version tag, with no minor and no latest'
        required: false
        type: string
        default: 'false'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 1.2.3'
        required: true
        type: string
      prerelease:
        description: 'true keeps only the exact version tag, with no minor and no latest'
        required: false
        type: string
        default: 'false'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DOCKERFILE: deploy/docker/Dockerfile

jobs:
  publish:
    name: Build and push linux/amd64 + linux/arm64
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # arm64 layers are produced under emulation on the amd64 runner.
      - name: Enable arm64 emulation
        run: docker run --privileged --rm tonistiigi/binfmt:latest --install arm64

      - name: Log in to ghcr.io
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Resolve image tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Every build is addressable by commit, so an image can always be traced
          # back to the tree it came from even when the moving tags move on.
          tags="${IMAGE}:sha-${SHA:0:7},${IMAGE}:${VERSION}"
          if [ "$PRERELEASE" != "true" ]; then
            tags="${tags},${IMAGE}:${VERSION%.*},${IMAGE}:latest"
          fi
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"
          printf 'resolved tags: %s\n' "$tags"

      - name: Build and push
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          # A container driver keeps the registry cache across runs and can push a
          # multi-arch result without a local image store.
          docker buildx create --driver docker-container --name yufu-image --use
          tag_args=()
          IFS=',' read -ra tag_list <<< "$TAGS"
          for tag in "${tag_list[@]}"; do
            tag_args+=(--tag "$tag")
          done
          docker buildx build \
            --builder yufu-image \
            --file "$DOCKERFILE" \
            --platform linux/amd64,linux/arm64 \
            "${tag_args[@]}" \
            --cache-from "type=registry,ref=${IMAGE}:buildcache" \
            --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
            --provenance mode=max \
            --sbom true \
            --push .

      - name: Report the pushed tags
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          printf 'Pushed:\n'
          printf '%s\n' "$TAGS" | tr ',' '\n' | sed 's/^/  /'
