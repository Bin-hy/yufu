name: Container image

# Release publishing and manual republishing use the same native builds.
# Moving tags are published only after BOTH architectures build and smoke-test.
on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without the v prefix, for example 1.2.3'
        required: true
        type: string
      prerelease:
        description: 'true publishes only the exact version and commit tags'
        required: false
        type: string
        default: 'false'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 1.2.3'
        required: true
        type: string
      prerelease:
        description: 'true publishes only the exact version and commit tags'
        required: false
        type: string
        default: 'false'

permissions:
  contents: read
  packages: write

env:
  DOCKERFILE: deploy/docker/Dockerfile

jobs:
  prepare:
    name: Validate image metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      tags: ${{ steps.metadata.outputs.tags }}
    steps:
      - name: Resolve image and tags
        id: metadata
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Invalid container version' >&2
            exit 1
          fi
          if [[ "$PRERELEASE" != 'true' && "$PRERELEASE" != 'false' ]]; then
            echo 'Invalid prerelease flag' >&2
            exit 1
          fi
          if [[ "$VERSION" == *-* && "$PRERELEASE" != 'true' ]]; then
            echo 'Prerelease versions must set prerelease=true' >&2
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tags="${image}:sha-${COMMIT:0:7},${image}:${VERSION}"
          if [[ "$PRERELEASE" == 'false' ]]; then
            tags="${tags},${image}:${VERSION%.*},${image}:latest"
          fi
          printf 'image=%s\ntags=%s\n' "$image" "$tags" >> "$GITHUB_OUTPUT"

  build:
    name: Native build linux/${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      ARCH: ${{ matrix.arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          docker version
          docker buildx version
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username '${{ github.actor }}' --password-stdin
      - name: Build and push immutable digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create --driver docker-container --name yufu-image --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --builder yufu-image \
            --file "$DOCKERFILE" \
            --platform "linux/${ARCH}" \
            --cache-from "type=registry,ref=${IMAGE}:buildcache-${ARCH}" \
            --cache-to "type=registry,ref=${IMAGE}:buildcache-${ARCH},mode=max" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --provenance mode=max \
            --sbom true \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" .
      - name: Smoke test and record digest
        shell: bash
        run: |
          set -euo pipefail
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/build-metadata.json")
          docker run --rm --platform "linux/${ARCH}" --entrypoint /usr/local/bin/yufu "${IMAGE}@${digest}" --version
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-digest-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    name: Publish verified multi-platform manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAGS: ${{ needs.prepare.outputs.tags }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: container-digest-linux-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username '${{ github.actor }}' --password-stdin
      - name: Assemble tags only after both native builds pass
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP/digests/"*)
          test "${#files[@]}" -eq 2
          sources=()
          for file in "${files[@]}"; do
            digest="${file##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("${IMAGE}@sha256:${digest}")
          done
          tag_args=()
          IFS=',' read -ra tag_list <<< "$TAGS"
          for tag in "${tag_list[@]}"; do tag_args+=(--tag "$tag"); done
          docker buildx imagetools create --dry-run "${sources[@]}" > "$RUNNER_TEMP/image-index.json"
          jq -e '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | unique == ["linux/amd64", "linux/arm64"]' "$RUNNER_TEMP/image-index.json"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          printf 'Pushed:\n%s\n' "$TAGS" | tr ',' '\n'
