name: Container recipe

# The CI matrix ignores deploy/docker/** because compiling the workspace on three
# operating systems learns nothing from a Dockerfile, and the publishing workflow
# only runs for a release tag. Without this workflow a broken recipe would first
# be discovered while releasing, so the recipe gets its own cheap path filter.
#
# This is a static BuildKit lint: no image is built, nothing is pushed and no
# registry credentials are used.
on:
  pull_request:
    paths: &paths
      - 'deploy/docker/**'
      - '.dockerignore'
      - '.github/workflows/docker-lint.yml'
  push:
    branches:
      - main
    paths: *paths

permissions:
  contents: read

jobs:
  lint:
    name: Lint the Dockerfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Same container driver the publishing workflow uses, so the lint runs
      # against the frontend that will actually build the release image.
      - name: Lint the recipe
        run: |
          set -euo pipefail
          docker buildx create --driver docker-container --name yufu-lint --use
          docker buildx inspect --bootstrap
          docker buildx build --check --file deploy/docker/Dockerfile .
      # The Dockerfile copies these into the runtime layer; --check does not read
      # the build context, so a renamed file would otherwise only fail at build.
      - name: Verify recipe inputs exist
        run: |
          set -euo pipefail
          for path in deploy/docker/yufu.toml.example deploy/docker/docker-entrypoint.sh; do
            test -f "$path" || { echo "Missing recipe input: $path" >&2; exit 1; }
          done
          printf 'recipe inputs present\n'
