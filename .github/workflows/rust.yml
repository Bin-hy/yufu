name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    CARGO_TERM_COLOR: always

jobs:
    check:
        strategy:
            fail-fast: false
            matrix:
                os: [ macos-latest, windows-latest, ubuntu-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout source code
              uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  components: rustfmt, clippy
            - name: Cache cargo registry and build
              uses: Swatinem/rust-cache@v2
            - name: Show version information
              run: |
                  cargo --version
                  cargo fmt --version
                  cargo clippy --version

            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - name: Install frontend dependencies
              run: |
                  npm install --global pnpm@12.10.1
                  pnpm install --frozen-lockfile
            - name: Build authentication frontend
              run: pnpm build:cobotusr
            - name: Verify frontend (Ubuntu)
              if: matrix.os == 'ubuntu-latest'
              run: |
                  pnpm --filter @cobotweb/cobotusr test
                  pnpm --filter @cobotweb/cobotusr check
                  pnpm --filter @cobotweb/cobotusr lint
            - name: Install browser engines (Ubuntu)
              if: matrix.os == 'ubuntu-latest'
              working-directory: cobotweb/apps/cobotusr
              run: node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit

            - name: Cargo format
              run: cargo fmt --all -- --check
            - name: Cargo clippy
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings
            - name: Cargo build
              run: cargo build --workspace --all-targets --all-features --release --verbose

            - name: Cargo Test (only on Ubuntu)
              if: matrix.os == 'ubuntu-latest'
              # Each integration case owns its disposable PostgreSQL database.
              run: |
                  cargo test --workspace --all-targets --all-features -- --test-threads=1
                  cargo test --workspace --doc --all-features

