name: CI

on:
    push:
        branches:
            - main
        # This pipeline compiles the workspace on three operating systems. It has
        # nothing to check in documentation, the Astro site or the Go SDK, and the
        # container recipe is covered by docker-lint.yml, so none of those changes
        # may burn a matrix run.
        paths-ignore: &ignored
            - 'docs/**'
            - '**/*.md'
            - '*.md'
            - 'website/**'
            - 'sdk/go/**'
            - 'deploy/docker/**'
            - 'brand/**'
            - '.gitignore'
            - '.dockerignore'
            - '.editorconfig'
    pull_request:
        branches:
            - main
        paths-ignore: *ignored

# The automatic token only ever reads this repository. Keep the ceiling explicit
# so a repository default of read-write cannot widen it, matching the other
# workflows in this directory.
permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    YUFU_READINESS_OUTPUT: docs/specs/product-readiness/evidence/ci

jobs:
    check:
        name: Build (${{ matrix.os }})
        # A cold release build of the whole workspace runs on three operating
        # systems; the default six-hour ceiling would hide a hung build.
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                os: [ macos-latest, windows-latest, ubuntu-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout source code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable
                  components: rustfmt, clippy
            - name: Cache cargo registry and build
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
            - name: Show version information
              run: |
                  cargo --version
                  cargo fmt --version
                  cargo clippy --version

            - name: Install Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
            - name: Install frontend dependencies
              run: |
                  npm install --global pnpm@12.10.1
                  pnpm install --frozen-lockfile
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.11'
            - name: Build authentication frontend
              run: python scripts/readiness.py run web-build
            - name: Cargo format
              run: python scripts/readiness.py run fmt
            - name: Cargo clippy
              run: python scripts/readiness.py run clippy
            - name: Cargo build
              run: python scripts/readiness.py run rust-build

            - name: Upload candidate build evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: readiness-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build-${{ matrix.os }}
                  path: docs/specs/product-readiness/evidence/ci/
                  if-no-files-found: warn
                  retention-days: 14

    verify:
        name: Tests (Ubuntu, disposable PostgreSQL)
        runs-on: ubuntu-latest
        # Integration tests drive disposable PostgreSQL containers and a real
        # browser, so a stuck fixture must fail fast instead of holding a runner.
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.11'
            - name: Install frontend dependencies
              run: |
                  npm install --global pnpm@12.10.1
                  pnpm install --frozen-lockfile
            - name: Verify evidence tooling and capability claims
              run: |
                  python scripts/readiness.py run tool-tests
                  python scripts/readiness.py capabilities
            - name: Build embedded console assets
              run: python scripts/readiness.py run web-build
            - name: Verify frontend
              run: |
                  python scripts/readiness.py run web-tests
                  python scripts/readiness.py run web-check
                  python scripts/readiness.py run web-lint
            # tests/yufu/routes/identity_browser_e2e.rs drives the Node runner,
            # which launches all three Playwright engines against real TLS fronts.
            - name: Install browser engines
              working-directory: web
              run: node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
            - name: Verify Rust with disposable PostgreSQL
              run: |
                  python scripts/readiness.py run rust-tests
                  python scripts/readiness.py run rust-doc
            - name: Upload candidate test evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: readiness-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-tests-ubuntu
                  path: docs/specs/product-readiness/evidence/ci/
                  if-no-files-found: warn
                  retention-days: 14
