name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    CARGO_TERM_COLOR: always

jobs:
    check:
        strategy:
            fail-fast: false
            matrix:
                os: [ macos-latest, windows-latest, ubuntu-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout source code
              uses: actions/checkout@v6
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  components: rustfmt, clippy
            - name: Cache cargo registry and build
              uses: Swatinem/rust-cache@v2
            - name: Install protoc
              uses: arduino/setup-protoc@v3
              # 【新增】专为 Windows 系统下载 Npcap SDK，并配置链接器环境变量
            - name: Install Npcap SDK (Only for Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  # 下载 Npcap SDK
                  Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "npcap-sdk.zip"
                  # 解压
                  Expand-Archive -Path "npcap-sdk.zip" -DestinationPath "npcap-sdk"
                  # 获取 x64 库文件的绝对路径
                  $NpcapLibPath = "$PWD\npcap-sdk\Lib\x64"
                  # 将路径追加到全局 LIB 环境变量中，让 MSVC 链接器能找到 Packet.lib
                  echo "LIB=$NpcapLibPath;$env:LIB" >> $env:GITHUB_ENV
            - name: Show version information
              run: |
                  cargo --version
                  cargo fmt --version
                  cargo clippy --version

            - name: Cargo format
              run: cargo fmt --all -- --check
            - name: Cargo clippy
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings
            - name: Cargo build
              run: cargo build --workspace --all-targets --all-features --release --verbose

            - name: Cargo Test (only on Ubuntu)
              if: matrix.os == 'ubuntu-latest'
              # 限制并发:testcontainers(Postgres) 在完全并发下会端口冲突/资源耗尽 flake,
              # 与 CLAUDE.md「Run all tests (reduced concurrency)」保持一致。
              run: cargo test --workspace --all-targets --all-features -- --test-threads=4

